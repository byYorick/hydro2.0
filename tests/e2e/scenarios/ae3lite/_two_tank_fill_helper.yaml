# Общий fill-path для realhw two-tank (AE3).
# Не сценарий: подключается через include_sequence из E101/E104/E106/E113.
#
# Канон:
# - water baseline снимается в solution_fill при solution_max OFF;
# - сразу max ON → ae3_water_baseline_invalid;
# - сид EC=T_full (≈2.2+) в calcium при max ON → recirc_dilute_blocked_solution_max;
# - fill Ca: ph=7.0, ec=0.45, max=false → wait WATER_BASELINE + pump_b dose → complete max=true.
#
# Имена шагов контрактные (test_ae3lite_*_scenario_contract.py) — не переименовывать.

kind: step_sequences

sequences:
  two_tank_fill_ca:
    - step: hold_solution_tank_filling_for_ca_dose
      type: ae_test_hook
      zone_id: ${zone_id}
      action: publish_command
      command:
        node_uid: ${test_node_uid}
        channel: storage_state
        cmd: set_fault_mode
        params:
          level_clean_min_override: true
          level_clean_max_override: true
          level_solution_min_override: true
          level_solution_max_override: false
      save: hold_solution_tank_filling_for_ca_dose_response

    - step: wait_hold_solution_tank_filling_for_ca_dose_done
      type: db.wait
      query: |
        SELECT id, cmd_id, status
        FROM commands
        WHERE cmd_id = :cmd_id
          AND status = 'DONE'
        ORDER BY created_at DESC
        LIMIT 1
      params:
        cmd_id: ${hold_solution_tank_filling_for_ca_dose_response.data.cmd_id}
      timeout: 20.0
      expected_rows: 1

    - step: seed_solution_fill_sensor_baseline
      type: ae_test_hook
      zone_id: ${zone_id}
      action: publish_command
      command:
        node_uid: ${test_node_uid}
        channel: storage_state
        cmd: set_fault_mode
        params:
          # Water-baseline: fill дозирует только calcium (pump_b) к T_ca.
          # max=false, иначе in-flow fill correction пропускается.
          level_clean_min_override: true
          level_clean_max_override: true
          level_solution_min_override: true
          level_solution_max_override: false
          ph_value: 7.0
          ec_value: 0.45
      save: seed_solution_fill_sensor_baseline_response

    - step: wait_seed_solution_fill_sensor_baseline_done
      type: db.wait
      query: |
        SELECT id, cmd_id, status
        FROM commands
        WHERE cmd_id = :cmd_id
          AND status = 'DONE'
        ORDER BY created_at DESC
        LIMIT 1
      params:
        cmd_id: ${seed_solution_fill_sensor_baseline_response.data.cmd_id}
      timeout: 20.0
      expected_rows: 1

    - step: wait_water_baseline_captured_event
      type: db.wait
      query: |
        SELECT id, type, created_at,
               COALESCE(details, payload_json) AS payload
        FROM zone_events
        WHERE zone_id = :zone_id
          AND type = 'WATER_BASELINE_CAPTURED'
          AND created_at >= :started_at
        ORDER BY created_at DESC, id DESC
        LIMIT 1
      params:
        zone_id: ${zone_id}
        started_at: ${scenario_window.0.started_at}
      timeout: 90.0
      expected_rows: 1
      save: water_baseline_event_row

    - step: wait_fill_ec_correction_command
      type: db.wait
      query: |
        SELECT id, channel, payload->>'cmd' AS cmd, created_at
        FROM ae_commands
        WHERE task_id = CAST(:task_id AS bigint)
          AND publish_status = 'accepted'
          AND channel = 'pump_b'
          AND payload->>'cmd' = 'dose'
        ORDER BY id DESC
        LIMIT 1
      params:
        task_id: ${task_id}
      timeout: 120.0
      expected_rows: 1
      save: fill_ec_correction_row

    # Diagnostic only: fill is Ca-only. Do NOT treat non-empty rows as success criterion.
    # pH doses belong in prepare_recirculation (see load_recirculation_ph_correction_commands_if_any).
    - step: load_fill_ph_correction_commands_if_any
      type: database_query
      query: |
        SELECT id, channel, payload->>'cmd' AS cmd
        FROM ae_commands
        WHERE task_id = CAST(:task_id AS bigint)
          AND publish_status = 'accepted'
          AND channel IN ('pump_acid', 'pump_base')
          AND payload->>'cmd' = 'dose'
        ORDER BY id DESC
        LIMIT 5
      params:
        task_id: ${task_id}
      save: fill_ph_correction_rows

    - step: complete_solution_fill_after_ec_correction
      type: ae_test_hook
      zone_id: ${zone_id}
      action: publish_command
      command:
        node_uid: ${test_node_uid}
        channel: storage_state
        cmd: set_fault_mode
        params:
          level_clean_min_override: true
          level_clean_max_override: true
          level_solution_min_override: true
          level_solution_max_override: true
      save: complete_solution_fill_after_ec_correction_response

    - step: wait_complete_solution_fill_after_ec_correction_done
      type: db.wait
      query: |
        SELECT id, cmd_id, status
        FROM commands
        WHERE cmd_id = :cmd_id
          AND status = 'DONE'
        ORDER BY created_at DESC
        LIMIT 1
      params:
        cmd_id: ${complete_solution_fill_after_ec_correction_response.data.cmd_id}
      timeout: 20.0
      expected_rows: 1
