# E239: не-DONE показывает тот же русский текст на состоянии зоны.

name: E239_ae4_non_done_zone_state_message
description: |
  Не-DONE mutating-команды оставляет тот же русский human_error_message
  в state_details зоны, который экран уже читает.

tags:
  - ae4
  - wave2
  - failure

meta:
