# Production MQTT Broker Configuration
# Security: Authentication required
#
# TLS listener 8883 добавляет mosquitto-entrypoint.sh, если смонтированы
# /mosquitto/certs/server.crt и server.key (см. generate_mqtt_certs.sh).
# MQTT_PLAINTEXT_ENABLED=0 убирает listener 1883 после перевода клиентов на 8883.

listener 1883
allow_anonymous false

# Password file for user authentication
password_file /mosquitto/config/passwords

# ACL file for topic access control
acl_file /mosquitto/config/acl

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /mosquitto/data/

# Connection settings
max_connections -1
max_inflight_messages 20
max_queued_messages 1000

# Message settings (max_packet_size removed - use default)

