# Development MQTT Broker Configuration
# Анонимные подключения запрещены. Пароли — файл passwords (не в git)
# или генерация entrypoint'ом из MQTT_*_PASS.
# ACL: backend/services/mqtt-bridge/acl

listener 1883
allow_anonymous false

password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

persistence false

max_connections -1
max_inflight_messages 20
max_queued_messages 1000
